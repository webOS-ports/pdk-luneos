# Layer configuration for meta-pdk - legacy webOS PDK/SDL application support.
#
# Add to conf/bblayers.conf:
#
#     BBLAYERS += "/path/to/pdk-luneos/yocto"
#
# and to conf/local.conf:
#
#     BBMULTICONFIG = "pdk-armel"
#     IMAGE_INSTALL:append = " packagegroup-luneos-pdk"
#
# See docs/yocto.md for the full picture.

BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-pdk"
BBFILE_PATTERN_meta-pdk := "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-pdk = "25"

LAYERSERIES_COMPAT_meta-pdk = "scarthgap wrynose"

# meta-oe carries libsdl2-image/ttf/mixer, which the games load for assets and
# music. meta-luneos is not a parse-time dependency - the runtime dependency on
# luna-send only matters when an image is actually assembled.
LAYERDEPENDS_meta-pdk = "core openembedded-layer"

# The pdk-armel machine and multiconfig live in this layer, so the multiconfig
# file has to be findable from the main build too.
BBFILES_DYNAMIC += " \
    meta-luneos:${LAYERDIR}/dynamic-layers/meta-luneos/recipes-*/*/*.bb \
    meta-luneos:${LAYERDIR}/dynamic-layers/meta-luneos/recipes-*/*/*.bbappend \
"
